<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11121a">
<title>RP Chat — 메신저</title>
<style>
:root{--bg:#0d0e14;--panel:#151720;--panel2:#1c1f2b;--line:#292c3b;--text:#f2f3fa;--muted:#969bb0;--accent:#b6a0ff;--accent2:#8d75ec;--mine:#7560d8;--danger:#ff727f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;height:100dvh}
button,input{font:inherit}button{cursor:pointer}
.app{height:100dvh;max-width:1440px;margin:auto;display:grid;grid-template-columns:76px 310px minmax(0,1fr);padding:14px;gap:12px}
.rail,.sidebar,.chat{background:var(--panel);border:1px solid var(--line);border-radius:22px;min-height:0}
.rail{display:flex;flex-direction:column;align-items:center;padding:16px 8px;gap:18px}
.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(140deg,#d6c8ff,#8569e9);display:grid;place-items:center;color:#171327;font-weight:900;font-size:19px;box-shadow:0 7px 24px #8d75ec30}
.railbtn{border:0;background:transparent;color:var(--muted);width:44px;height:44px;border-radius:14px;font-size:20px}
.railbtn.active,.railbtn:hover{background:#2a2540;color:var(--accent)}.railbottom{margin-top:auto}
.sidebar{display:flex;flex-direction:column;overflow:hidden}
.sidehead{padding:23px 20px 16px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:800}.sidehead h1{margin:7px 0 18px;font-size:25px;letter-spacing:-1px}
.search{width:100%;border:1px solid var(--line);background:#101119;color:var(--text);border-radius:12px;padding:12px 13px;outline:none}.search:focus,.composer input:focus{border-color:var(--accent)}
.sectionlabel{display:flex;align-items:center;justify-content:space-between;padding:7px 20px;color:var(--muted);font-size:12px;font-weight:700}
.contactlist{overflow-y:auto;padding:4px 9px 12px}
.contact{display:flex;gap:11px;align-items:center;padding:12px 10px;border-radius:15px;cursor:pointer;min-width:0;border:1px solid transparent}
.contact:hover{background:#1c1f2a}.contact.selected{background:#28233d;border-color:#393052}
.avatar{width:43px;height:43px;flex-shrink:0;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:15px;background:linear-gradient(140deg,#f0c9ff,#8b78e9);color:#211b36;position:relative}
.avatar.green{background:linear-gradient(140deg,#b7f1d3,#4caa92);color:#15382d}.avatar.orange{background:linear-gradient(140deg,#ffd5a1,#e68e71);color:#4b251c}.avatar.blue{background:linear-gradient(140deg,#b6ddff,#698fe6);color:#172b52}.avatar.pink{background:linear-gradient(140deg,#ffc4dc,#db76aa);color:#4c1938}
.dot{position:absolute;width:10px;height:10px;border:2px solid var(--panel);border-radius:50%;background:#6ce2a7;right:-1px;bottom:0}
.contact.selected .dot{border-color:#28233d}
.contactinfo{min-width:0;flex:1}.contacttop{display:flex;justify-content:space-between;gap:5px;align-items:center}.contactname{font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:10px;color:var(--muted);white-space:nowrap}.preview{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:14px;display:flex;gap:10px;align-items:center}.sidefoot .avatar{width:36px;height:36px;border-radius:12px}.meinfo{flex:1;min-width:0}.meinfo strong{display:block;font-size:12px}.meinfo small{color:var(--muted);font-size:10px}
.chat{display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(ellipse at 80% 0%,#29213d40,transparent 35%),var(--panel)}
.chathead{display:flex;align-items:center;gap:12px;padding:17px 23px;border-bottom:1px solid var(--line);min-height:82px}
.chathead .avatar{width:44px;height:44px}.headinfo{flex:1;min-width:0}.headinfo strong{font-size:14px}.headinfo p{margin:5px 0 0;color:var(--muted);font-size:11px}.online{color:#70e4a8}.headactions{display:flex;gap:8px}.iconbtn{border:1px solid var(--line);background:#1b1d28;color:#c9c9d9;border-radius:12px;width:38px;height:38px}
.messages{flex:1;overflow-y:auto;padding:25px clamp(14px,4vw,48px);display:flex;flex-direction:column;gap:15px}
.daylabel{align-self:center;font-size:10px;color:var(--muted);background:#20222e;padding:7px 12px;border-radius:20px;margin:3px 0 10px}
.msgrow{display:flex;flex-direction:column;max-width:min(76%,520px);gap:5px;align-self:flex-start}.msgrow.mine{align-self:flex-end;align-items:flex-end}
.msgmeta{font-size:10px;color:var(--muted);padding:0 4px}.bubble{font-size:13px;line-height:1.65;padding:11px 14px;border-radius:5px 17px 17px 17px;background:#222531;white-space:pre-wrap;overflow-wrap:anywhere}.mine .bubble{background:linear-gradient(135deg,#7964dd,#6652c6);border-radius:17px 5px 17px 17px;color:white}
.welcome{margin:auto;text-align:center;max-width:330px;padding:24px}.welcomeicon{width:72px;height:72px;border-radius:25px;background:#292440;color:var(--accent);display:grid;place-items:center;font-size:31px;margin:0 auto 18px}.welcome h2{font-size:21px;margin:0 0 9px}.welcome p{color:var(--muted);font-size:12px;line-height:1.7}
.composerwrap{padding:12px 22px 19px}.hint{font-size:10px;color:var(--muted);text-align:center;margin:0 0 10px}.composer{display:flex;align-items:center;gap:10px;padding:8px;background:#101119;border:1px solid var(--line);border-radius:16px}.composer input{flex:1;min-width:0;background:transparent;border:1px solid transparent;color:var(--text);outline:none;padding:10px 6px;font-size:13px}.send{border:0;background:var(--accent);color:#1b1630;font-weight:850;border-radius:12px;padding:11px 16px}.send:hover{background:#c8b9ff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#28243a;border:1px solid #50436f;color:#e9e2ff;border-radius:12px;padding:11px 15px;font-size:12px;display:none;z-index:5}
.mobileback{display:none}
@media(max-width:760px){.app{display:block;padding:0;height:100dvh}.rail{display:none}.sidebar,.chat{position:absolute;inset:0;border-radius:0;border:0}.sidebar{z-index:2}.chat{z-index:1}.app.chat-open .sidebar{display:none}.app:not(.chat-open) .chat{display:none}.sidehead{padding:20px 18px 14px}.chathead{padding:13px 15px;min-height:72px}.messages{padding:20px 15px}.composerwrap{padding:10px 12px calc(12px + env(safe-area-inset-bottom))}.msgrow{max-width:88%}.mobileback{display:inline-block;margin-right:1px}.headactions .iconbtn:nth-child(2){display:none}.sidefoot{padding-bottom:calc(14px + env(safe-area-inset-bottom))}}

.authscreen{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at 50% 0%,#29213d,transparent 55%),var(--bg);display:grid;place-items:center;padding:20px}.authcard{width:min(100%,420px);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 20px 70px #0006}.authlogo{display:grid;place-items:center;margin:0 auto 14px;width:58px;height:58px;border-radius:19px;background:linear-gradient(140deg,#d6c8ff,#8569e9);color:#171327;font-weight:900;font-size:24px}.authcard h2{text-align:center;margin:0 0 7px}.authcard .sub{text-align:center;color:var(--muted);font-size:12px;margin:0 0 22px}.authcard label{display:block;color:var(--muted);font-size:12px;margin:13px 0 6px}.authcard input{width:100%;background:#101119;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;outline:none}.authbtn{width:100%;border:0;border-radius:12px;padding:12px;background:var(--accent);color:#1b1630;font-weight:800;margin-top:15px}.authsecondary{width:100%;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:9px}.roomtools{display:flex;gap:7px;padding:0 12px 12px}.roomtools button{flex:1;border:1px solid var(--line);border-radius:10px;background:#20222e;color:var(--text);padding:9px 5px;font-size:11px}.hidden{display:none!important}
</style>
</head>
<body>
<section class="authscreen" id="authscreen"><div class="authcard"><div class="authlogo">RP</div><h2 id="authTitle">RP Chat에 오신 걸 환영해요</h2><p class="sub">이메일 형식 아이디로 가입하고 친구와 대화하세요.</p><form id="authForm"><label for="authName">닉네임 (회원가입 시)</label><input id="authName" placeholder="사용할 닉네임" maxlength="24"><label for="authEmail">아이디 (이메일 형식)</label><input id="authEmail" type="email" autocomplete="username" placeholder="rpchat@example.com" required><label for="authPassword">비밀번호</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6" placeholder="6자 이상" required><button class="authbtn" id="authSubmit" type="submit">회원가입</button></form><button class="authsecondary" id="authToggle" type="button">이미 계정이 있어요 · 로그인</button><p class="sub" style="margin:15px 0 0">비밀번호는 Firebase 인증으로 처리돼요. 이 화면은 구글 로그인과 무관해요.</p></div></section>
<div class="app" id="app">
  <nav class="rail" aria-label="메인 메뉴">
    <div class="logo">RP</div>
    <button class="railbtn active" title="메시지">▤</button>
    <button class="railbtn" title="친구" id="friendsNav">♙</button>
    <button class="railbtn" title="알림" id="notifyNav">♧</button>
    <button class="railbtn railbottom" title="설정" id="settingsNav">⚙</button>
  </nav>
  <aside class="sidebar">
    <div class="sidehead">
      <div class="eyebrow">YOUR SPACE · YOUR PEOPLE</div>
      <h1>메시지 <span style="color:var(--accent)">✦</span></h1>
      <input class="search" id="search" placeholder="대화 검색..." aria-label="대화 검색">
    </div>
    <div class="sectionlabel"><span>대화 목록</span><span id="count">00</span></div><div class="roomtools"><button id="createRoom">＋ 방 만들기</button><button id="joinRoom">↗ 코드로 참여</button></div>
    <div class="contactlist" id="contactlist"></div>
    <div class="sidefoot">
      <div class="avatar">R</div>
      <div class="meinfo"><strong id="myName">내 계정</strong><small id="myEmail">로그인됨</small></div>
      <button class="iconbtn" id="rename" title="로그아웃">↪</button>
    </div>
  </aside>
  <main class="chat">
    <header class="chathead">
      <button class="iconbtn mobileback" id="back" aria-label="대화 목록으로">←</button>
      <div class="avatar" id="headAvatar">M<span class="dot"></span></div>
      <div class="headinfo"><strong id="headName">민서</strong><p id="headStatus"><span class="online">●</span> 예시 대화 · 오프라인 데모</p></div>
      <div class="headactions"><button class="iconbtn" id="searchChat" title="메시지 검색">⌕</button><button class="iconbtn" id="chatInfo" title="대화 정보">ⓘ</button></div>
    </header>
    <section class="messages" id="messages" aria-live="polite"></section>
    <div class="composerwrap">
      <p class="hint" id="chatHint">Firebase 실시간 채팅 · 방 참여 코드 공유</p>
      <form class="composer" id="form">
        <input id="messageInput" autocomplete="off" placeholder="메시지를 입력해 보세요..." maxlength="2000" aria-label="메시지 입력">
        <button class="send" type="submit">전송 ↗</button>
      </form>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, onSnapshot, addDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCb2n9fodJmFXjg2vklL_wop7CbNlklLpk",
  authDomain: "rp-chat-b1d52.firebaseapp.com",
  projectId: "rp-chat-b1d52",
  storageBucket: "rp-chat-b1d52.firebasestorage.app",
  messagingSenderId: "153321397549",
  appId: "1:153321397549:web:0ff6c0fd000955349d07a4",
  measurementId: "G-GHS1NK2FZC"
};
const appFirebase=initializeApp(firebaseConfig), auth=getAuth(appFirebase), db=getFirestore(appFirebase);
const $=id=>document.getElementById(id);let user=null, signupMode=true, activeRoom=null, unsubscribeMessages=null, unsubscribeRooms=null, roomList=[];
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2800)}
function makeCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=chars[Math.floor(Math.random()*chars.length)];return s;}
$('authToggle').onclick=()=>{signupMode=!signupMode;$('authTitle').textContent=signupMode?'RP Chat에 오신 걸 환영해요':'다시 만나서 반가워요';$('authName').classList.toggle('hidden',!signupMode);$('authSubmit').textContent=signupMode?'회원가입':'로그인';$('authToggle').textContent=signupMode?'이미 계정이 있어요 · 로그인':'계정이 없어요 · 회원가입';$('authPassword').autocomplete=signupMode?'new-password':'current-password';};
$('authForm').addEventListener('submit',async e=>{e.preventDefault();const email=$('authEmail').value.trim(),password=$('authPassword').value,name=$('authName').value.trim();$('authSubmit').disabled=true;try{if(signupMode){if(!name)throw new Error('회원가입할 때 닉네임을 입력해 줘.');const cred=await createUserWithEmailAndPassword(auth,email,password);await updateProfile(cred.user,{displayName:name});await setDoc(doc(db,'users',cred.user.uid),{uid:cred.user.uid,nickname:name,email:email,createdAt:serverTimestamp()});}else await signInWithEmailAndPassword(auth,email,password);}catch(err){toast(authError(err));}finally{$('authSubmit').disabled=false;}});
function authError(e){const c=e?.code||'';return ({'auth/email-already-in-use':'이 이메일은 이미 가입되어 있어. 로그인해 줘.','auth/invalid-email':'이메일 형식의 아이디를 확인해 줘.','auth/weak-password':'비밀번호는 6자 이상으로 만들어 줘.','auth/invalid-credential':'아이디 또는 비밀번호가 맞지 않아.','auth/network-request-failed':'인터넷 연결을 확인해 줘.'})[c]||e.message||'오류가 발생했어.'}
onAuthStateChanged(auth,async u=>{user=u;$('authscreen').classList.toggle('hidden',!!u);$('app').classList.toggle('hidden',!u);if(!u){if(unsubscribeRooms)unsubscribeRooms();if(unsubscribeMessages)unsubscribeMessages();return;} $('myName').textContent=u.displayName||u.email.split('@')[0];$('myEmail').textContent=u.email||'';watchRooms();});
function watchRooms(){if(unsubscribeRooms)unsubscribeRooms();const q=query(collection(db,'users',user.uid,'rooms'));unsubscribeRooms=onSnapshot(q,async snap=>{const ids=snap.docs.map(d=>d.id);const data=[];for(const id of ids){try{const rd=await getDoc(doc(db,'rooms',id));if(rd.exists())data.push({id,...rd.data()})}catch{}}roomList=data;renderRooms();if(!activeRoom&&data.length)openRoom(data[0].id);},err=>toast('대화 목록 오류: '+err.message));}
function renderRooms(){const q=$('search').value.trim().toLowerCase();const filtered=roomList.filter(r=>(r.name||'채팅방').toLowerCase().includes(q)||r.id.toLowerCase().includes(q));$('count').textContent=String(filtered.length).padStart(2,'0');$('contactlist').innerHTML=filtered.map(r=>`<div class="contact ${r.id===activeRoom?'selected':''}" data-id="${safe(r.id)}"><div class="avatar">✦</div><div class="contactinfo"><div class="contacttop"><span class="contactname">${safe(r.name||'채팅방')}</span></div><div class="preview">참여 코드: ${safe(r.id)}</div></div></div>`).join('')||'<p style="color:var(--muted);font-size:12px;padding:18px">대화방이 없어요. 방을 만들거나 코드로 참여해 보세요.</p>';document.querySelectorAll('.contact').forEach(el=>el.onclick=()=>openRoom(el.dataset.id));}
async function openRoom(id){activeRoom=id;const r=roomList.find(x=>x.id===id);$('headName').textContent=r?.name||'채팅방';$('headAvatar').textContent='✦';$('headAvatar').className='avatar';$('headStatus').textContent='실시간 채팅 · 코드 '+id;$('chatHint').textContent='참여 코드: '+id+' · 친구에게 코드를 알려 줘';$('app').classList.add('chat-open');renderRooms();if(unsubscribeMessages)unsubscribeMessages();const q=query(collection(db,'rooms',id,'messages'),orderBy('createdAt','asc'));unsubscribeMessages=onSnapshot(q,snap=>{const box=$('messages');box.innerHTML=snap.docs.map(d=>{const m=d.data(),mine=m.senderId===user.uid,time=m.createdAt?.toDate?m.createdAt.toDate().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'';return `<div class="msgrow ${mine?'mine':''}"><div class="msgmeta">${safe(m.senderName||'사용자')} · ${safe(time)}</div><div class="bubble">${safe(m.text)}</div></div>`}).join('')||'<div class="welcome"><div class="welcomeicon">✦</div><h2>대화를 시작해 보세요</h2><p>첫 메시지를 보내 보세요!</p></div>';box.scrollTop=box.scrollHeight;},err=>toast('메시지 불러오기 실패: '+err.message));}
$('createRoom').onclick=async()=>{const name=prompt('채팅방 이름을 입력해 줘.','우리들의 방');if(!name?.trim())return;try{const id=makeCode()+makeCode();await setDoc(doc(db,'rooms',id),{name:name.trim().slice(0,40),members:[user.uid],createdBy:user.uid,createdAt:serverTimestamp()});await setDoc(doc(db,'users',user.uid,'rooms',id),{joinedAt:serverTimestamp()});toast('방을 만들었어! 참여 코드를 친구에게 알려 줘: '+id); }catch(e){toast('방 만들기 실패: '+e.message)}};
$('joinRoom').onclick=async()=>{const id=prompt('친구에게 받은 16자리 참여 코드를 입력해 줘.');if(!id?.trim())return;const code=id.trim().toUpperCase();try{const ref=doc(db,'rooms',code),snap=await getDoc(ref);if(!snap.exists())throw new Error('해당 코드의 방을 찾지 못했어.');const data=snap.data();if(!data.members.includes(user.uid))await updateDoc(ref,{members:[...data.members,user.uid]});await setDoc(doc(db,'users',user.uid,'rooms',code),{joinedAt:serverTimestamp()});toast('채팅방에 참여했어!');}catch(e){toast('참여 실패: '+e.message)}};
$('form').addEventListener('submit',async e=>{e.preventDefault();const text=$('messageInput').value.trim();if(!text||!activeRoom)return;try{await addDoc(collection(db,'rooms',activeRoom,'messages'),{text,senderId:user.uid,senderName:user.displayName||user.email.split('@')[0],createdAt:serverTimestamp()});$('messageInput').value='';}catch(err){toast('전송 실패: '+err.message)}});
$('search').addEventListener('input',renderRooms);$('back').onclick=()=>$('app').classList.remove('chat-open');$('rename').onclick=async()=>{if(confirm('RP Chat에서 로그아웃할까?'))await signOut(auth)};$('searchChat').onclick=()=>{const term=prompt('현재 화면에서 찾을 단어를 입력해 줘.');if(!term)return;const rows=[...$('messages').querySelectorAll('.msgrow')];const row=rows.find(r=>r.textContent.toLowerCase().includes(term.toLowerCase()));if(row)row.scrollIntoView({behavior:'smooth',block:'center'});else toast('일치하는 메시지가 없어.')};$('chatInfo').onclick=()=>{if(activeRoom)toast('참여 코드: '+activeRoom)};$('friendsNav').onclick=()=>$('joinRoom').click();$('notifyNav').onclick=()=>toast('새 알림이 없어요.');$('settingsNav').onclick=()=>toast('로그아웃은 왼쪽 아래 화살표를 눌러 줘.');
</script>
</body>
</html>
